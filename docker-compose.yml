version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ragsaas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
      
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8050:8000"
    depends_on:
      postgres:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    volumes:
      - ./uploads:/app/uploads
      - ./vector_db:/app/vector_db
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-ragsaas}
      - USE_MOCK_LLM=true
    depends_on:
      - postgres
      - redis

  # Resto de servicios igual
  

  # Redis for Celery
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always
    networks:
      - app-network

  # Ollama for LLM
  
volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge